# Production: runs the published image from GitHub, no source code needed on the server.
# Put this file and a .env (see .env.prod.example) in one folder, then:
#   docker compose -f docker-compose.prod.yml up -d
name: rekenen

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rekenen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rekenen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekenen -d rekenen"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/jorann/rekenen:${REKENEN_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rekenen:${POSTGRES_PASSWORD}@db:5432/rekenen
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # The parent dashboard (optional). Runs with COMPOSE_PROFILES=dashboard and a DASHBOARD_PASSWORD in .env.
  dashboard:
    image: ghcr.io/jorann/rekenen-dashboard:${REKENEN_VERSION:-latest}
    profiles: [dashboard]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rekenen:${POSTGRES_PASSWORD}@db:5432/rekenen
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
