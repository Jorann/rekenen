services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rekenen
      POSTGRES_PASSWORD: rekenen
      POSTGRES_DB: rekenen
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekenen -d rekenen"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rekenen:rekenen@db:5432/rekenen
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # The parent dashboard, on port 3001. Only with COMPOSE_PROFILES=dashboard and DASHBOARD_PASSWORD in .env.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    profiles: [dashboard]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://rekenen:rekenen@db:5432/rekenen
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    ports:
      - "3001:3001"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
