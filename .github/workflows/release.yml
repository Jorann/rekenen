# Publishes the app and the parent dashboard as Docker images when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# ghcr.io/jorann/rekenen and ghcr.io/jorann/rekenen-dashboard each get the tags 1.2.0, 1.2, 1 and latest
# (pre-releases like v1.3.0-rc1 don't move latest).
# It then creates a GitHub release with that version's CHANGELOG.md section as the notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Changelog has an entry for this version
        run: sh .github/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/jorann/rekenen
            dockerfile: Dockerfile
          - image: ghcr.io/jorann/rekenen-dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 for a typical server, arm64 for a Raspberry Pi or an Apple Silicon Mac.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Once the images are out, publish a GitHub release whose notes are this version's changelog section.
  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh .github/release-notes.sh "$version" > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Regenboog Rekenen $version" --notes-file notes.md $prerelease
